spring:
  config:
    import: "optional:file:./.env.local[.properties],optional:file:./backend/.env.local[.properties]"
  application:
    name: aquaalert-backend

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${AQUAALERT_MAIL_USERNAME:}
    password: ${AQUAALERT_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  datasource:
    # Default to localhost for direct local runs; Docker can still override via DB_URL.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aquaalert}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:200417}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates it matches
      # the entities — this catches entity/migration drift at boot time
      # instead of silently corrupting data in production.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

app:
  frontend-url: ${AQUAALERT_FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_PROD_min_256_bit_secret_key_______}
    access-token-expiry-minutes: 30
    refresh-token-expiry-days: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  scheduler:
    # How often the notification job polls for due water schedules.
    # 60s in production; tests/dev can override to poll faster.
    notification-poll-interval-ms: ${NOTIFICATION_POLL_INTERVAL_MS:60000}
  notifications:
    email:
      enabled: ${AQUAALERT_MAIL_ENABLED:false}
      test-recipient: ${AQUAALERT_TEST_EMAIL:}
      from: ${AQUAALERT_MAIL_FROM:}
      sender-name: ${AQUAALERT_MAIL_SENDER_NAME:AquaAlert}
    sms:
      provider: ${SMS_PROVIDER:msg91}
      api-key: ${SMS_API_KEY:}
    voice:
      provider: ${VOICE_PROVIDER:twilio}
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
    fcm:
      service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.aquaalert: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.aquaalert: DEBUG
    org.hibernate.SQL: DEBUG
